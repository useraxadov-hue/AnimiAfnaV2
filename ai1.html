<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tezkor AI Chat</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .chat-container { width: 100%; max-width: 600px; background: white; border-radius: 12px; box-shadow: 0 5px 25px rgba(0,0,0,0.1); overflow: hidden; }
        #chat-box { height: 400px; overflow-y: auto; padding: 15px; border-bottom: 1px solid #eee; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 8px 12px; border-radius: 18px; max-width: 80% }
        .user { align-self: flex-end; background: #007bff; color: white; }
        .ai { align-self: flex-start; background: #e9ecef; color: #333; }
        .input-group { display: flex; padding: 15px; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        button { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; transition: 0.3s; }
        button:disabled { background: #ccc; }
        #status { font-size: 12px; color: #888; padding: 0 15px; }
    </style>
</head>
<body>

<div class="chat-container">
    <h3 style="text-align: center;">Tezkor AI Yordamchi</h3>
    <div id="status">Model yuklanmoqda...</div>
    <div id="chat-box"></div>
    <div class="input-group">
        <input type="text" id="user-input" placeholder="Xabar..." disabled>
        <button id="send-btn" disabled>Yuborish</button>
    </div>
</div>

<script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    // ENG TEZ MODEL: Phi-3-mini
    const selectedModel = "Phi-3-mini-4k-instruct-q4f16_1-MLC";
    const engine = new webllm.MLCEngine();

    const statusLabel = document.getElementById("status");
    const chatBox = document.getElementById("chat-box");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    // "O'qitish" qismi - AI ga rol beramiz (Kontekst)
    const systemPrompt = "Siz O'zbekistondagi eng tezkor yordamchisiz. Javoblaringiz juda qisqa, aniq va faqat o'zbek tilida bo'lsin.";

    engine.setInitProgressCallback((report) => {
        statusLabel.innerText = "Yuklanmoqda: " + Math.round(report.progress * 100) + "%";
    });

    async function init() {
        try {
            await engine.reload(selectedModel);
            statusLabel.innerText = "AI tayyor! (Online)";
            userInput.disabled = false;
            sendBtn.disabled = false;
        } catch (e) {
            statusLabel.innerText = "Xatolik: WebGPU qo'llab-quvvatlanmaydi.";
        }
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage(text, 'user');
        userInput.value = "";
        sendBtn.disabled = true;

        const messages = [
            { role: "system", content: systemPrompt },
            { role: "user", content: text }
        ];

        // Generatsiya boshlanishi
        const reply = await engine.chat.completions.create({ messages });
        appendMessage(reply.choices[0].message.content, 'ai');
        
        sendBtn.disabled = false;
    }

    function appendMessage(text, side) {
        const div = document.createElement("div");
        div.className = `msg ${side}`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    sendBtn.onclick = sendMessage;
    userInput.addEventListener("keypress", (e) => { if(e.key === "Enter") sendMessage(); });

    init();
</script>

</body>
</html>
