<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmos System Config</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0f0f0f; color: #fff; font-family: 'Roboto', sans-serif; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: #161616; padding: 25px; border-radius: 16px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2 { color: #A47CF3; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; font-size: 22px; }
    
    .section-title { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 1px; margin: 25px 0 10px; border-bottom: 1px solid #222; padding-bottom: 5px; display: flex; align-items: center; gap: 5px; }
    
    .field { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; color: #aaa; }
    input, textarea { width: 100%; padding: 12px 15px; background: #0a0a0a; border: 1px solid #333; color: #A47CF3; border-radius: 10px; outline: none; transition: 0.3s; font-family: monospace; }
    input:focus, textarea:focus { border-color: #A47CF3; box-shadow: 0 0 8px rgba(164, 124, 243, 0.2); }
    
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    
    .btn-save { background: linear-gradient(45deg, #A47CF3, #683FEA); color: #fff; border: none; padding: 15px; border-radius: 12px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; margin-top: 20px; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-reset { background: #f44336; color: #fff; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 12px; margin-top: 5px; opacity: 0.8; }
    .btn-save:hover, .btn-reset:hover { opacity: 1; transform: translateY(-2px); }

    #status { margin-top: 15px; text-align: center; font-size: 14px; min-height: 20px; }
    .success { color: #4caf50; }
    .error { color: #f44336; }

    .logo-preview-container { display: flex; align-items: center; gap: 15px; background: #0a0a0a; padding: 10px; border-radius: 10px; border: 1px dashed #444; }
    #logoPreview { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; background: #222; }

    .color-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
    .color-input-wrapper { display: flex; align-items: center; gap: 10px; background: #0a0a0a; padding: 5px 10px; border-radius: 10px; border: 1px solid #333; }
    input[type="color"] { width: 40px; height: 40px; border: none; background: none; cursor: pointer; }
    textarea { height: 80px; resize: vertical; font-size: 11px; }
  </style>
</head>
<body>

<div class="container">
  <h2><i class="material-icons">settings</i> Cosmos Config Engine</h2>

  <div class="section-title"><i class="material-icons">info</i> Asosiy Ma'lumotlar</div>
  <div class="row">
    <div class="field">
      <label>Sayt Nomi</label>
      <input type="text" id="siteName" placeholder="O'zgartirilmasin">
    </div>
    <div class="field">
      <label>Jamoa Nomi</label>
      <input type="text" id="dubName" placeholder="O'zgartirilmasin">
    </div>
  </div>

  <div class="field">
    <label>Logotip (Rasm yuklash)</label>
    <div class="logo-preview-container">
      <img id="logoPreview" src="">
      <input type="file" id="logoFile" accept="image/*">
    </div>
  </div>

  <div class="section-title"><i class="material-icons">leaderboard</i> Anime Reyting & Bo'limlar</div>
  <div class="row">
    <div class="field">
      <label>Bo'lim nomi (Masalan: Mashhur)</label>
      <input type="text" id="catName" placeholder="Kiritilmasa o'zgarmaydi">
    </div>
    <div class="field">
      <label>Nechanchi o'rinda tursin? (Rank)</label>
      <input type="number" id="catRank" placeholder="1">
    </div>
  </div>

  <div class="section-title"><i class="material-icons">palette</i> Sayt Dizayni & Stil</div>
  <div class="field">
    <label>Asosiy Fon Gradienti</label>
    <input type="text" id="mainGradient" placeholder="linear-gradient(45deg, #A47CF3, #683FEA)">
  </div>

  <div class="color-grid">
    <div class="field">
      <label>Tugma Rangi</label>
      <div class="color-input-wrapper">
        <input type="color" id="btnColor" value="#A47CF3">
        <input type="text" id="btnColorHex" value="#A47CF3">
      </div>
    </div>
    <div class="field">
      <label>Filtr Fon Rangi</label>
      <div class="color-input-wrapper">
        <input type="color" id="filterBg" value="#161616">
        <input type="text" id="filterBgHex" value="#161616">
      </div>
    </div>
  </div>

  <div class="row">
    <div class="field">
      <label>Ovoz Berish SVG</label>
      <textarea id="svgVote"></textarea>
    </div>
    <div class="field">
      <label>Qidiruv SVG</label>
      <textarea id="svgSearch"></textarea>
    </div>
  </div>

  <div class="section-title"><i class="material-icons">code</i> API & user.cfg</div>
  <div class="field">
    <label>Firebase DB URL</label>
    <input type="text" id="dbUrl">
  </div>
  <div class="row">
    <div class="field">
      <label>GitHub Anime</label>
      <input type="text" id="githubAnime">
    </div>
    <div class="field">
      <label>ImgBB Key</label>
      <input type="password" id="imgbbKey">
    </div>
  </div>

  <button class="btn-save" onclick="saveConfig()" id="saveBtn">
    <i class="material-icons">save</i> O'zgarishlarni Saqlash
  </button>

  <button class="btn-reset" onclick="resetToDefaults()">
    <i class="material-icons">refresh</i> Tizimni Reset qilish (cfg/user.cfg)
  </button>
  
  <div id="status"></div>
</div>

<script>
  const DB_BASE = "https://test-82a8a-default-rtdb.firebaseio.com";
  const CONFIG_URL = `${DB_BASE}/system_config.json`;
  const USER_CFG_URL = `${DB_BASE}/cfg/user_cfg.json`;
  let currentConfig = {};

  async function loadConfig() {
    try {
      const res = await axios.get(CONFIG_URL);
      if (res.data) {
        currentConfig = res.data;
        document.getElementById('siteName').placeholder = currentConfig.siteName || "Nom kiritilmagan";
        document.getElementById('dubName').placeholder = currentConfig.dubName || "Jamoa kiritilmagan";
        document.getElementById('logoPreview').src = currentConfig.logoUrl || "";
        document.getElementById('dbUrl').value = currentConfig.dbUrl || "";
        document.getElementById('githubAnime').value = currentConfig.githubAnime || "";
        document.getElementById('imgbbKey').value = currentConfig.imgbbKey || "";
        // Dizayn qiymatlari
        document.getElementById('mainGradient').value = currentConfig.mainGradient || "";
        document.getElementById('btnColorHex').value = currentConfig.btnColor || "#A47CF3";
        document.getElementById('svgVote').value = currentConfig.svgVote || "";
      }
    } catch (e) { console.log("Yuklashda xato."); }
  }

  async function uploadToImgBB(file) {
    const key = document.getElementById('imgbbKey').value || currentConfig.imgbbKey;
    const formData = new FormData();
    formData.append("image", file);
    try {
      const res = await axios.post(`https://api.imgbb.com/1/upload?key=${key}`, formData);
      return res.data.data.url;
    } catch (e) { return null; }
  }

  async function saveConfig() {
    const btn = document.getElementById('saveBtn');
    const status = document.getElementById('status');
    btn.disabled = true;
    status.innerHTML = "Saqlanmoqda...";

    let finalLogoUrl = currentConfig.logoUrl;
    const fileInput = document.getElementById('logoFile');
    if (fileInput.files[0]) {
      const uploaded = await uploadToImgBB(fileInput.files[0]);
      if (uploaded) finalLogoUrl = uploaded;
    }

    // Faqat kiritilgan ma'lumotlarni olish, bo'sh bo'lsa eskisi qoladi
    const newData = {
      siteName: document.getElementById('siteName').value || currentConfig.siteName,
      dubName: document.getElementById('dubName').value || currentConfig.dubName,
      dbUrl: document.getElementById('dbUrl').value || currentConfig.dbUrl,
      githubAnime: document.getElementById('githubAnime').value || currentConfig.githubAnime,
      imgbbKey: document.getElementById('imgbbKey').value || currentConfig.imgbbKey,
      logoUrl: finalLogoUrl,
      mainGradient: document.getElementById('mainGradient').value || currentConfig.mainGradient,
      btnColor: document.getElementById('btnColorHex').value || currentConfig.btnColor,
      filterBg: document.getElementById('filterBgHex').value || currentConfig.filterBg,
      category: {
        name: document.getElementById('catName').value || (currentConfig.category ? currentConfig.category.name : "Yangi"),
        rank: document.getElementById('catRank').value || (currentConfig.category ? currentConfig.category.rank : 1)
      },
      svgVote: document.getElementById('svgVote').value || currentConfig.svgVote,
      svgSearch: document.getElementById('svgSearch').value || currentConfig.svgSearch
    };

    try {
      await axios.put(CONFIG_URL, newData);
      status.innerHTML = "<span class='success'>Saqlandi!</span>";
      loadConfig();
    } catch (e) { status.innerHTML = "<span class='error'>Xatolik!</span>"; }
    btn.disabled = false;
  }

  async function resetToDefaults() {
    if(confirm("Barcha sozlamalar cfg/user.cfg bo'yicha boshlang'ich holatga qaytarilsinmi?")) {
      try {
        const defaultConfig = {
          siteName: "Anime",
          dubName: "Dubbing",
          mainGradient: "linear-gradient(45deg, #A47CF3, #683FEA)",
          btnColor: "#A47CF3",
          filterBg: "#161616"
        };
        await axios.put(CONFIG_URL, defaultConfig);
        await axios.put(USER_CFG_URL, { last_reset: new Date().toISOString() });
        location.reload();
      } catch (e) { alert("Resetda xato!"); }
    }
  }

  loadConfig();
</script>
</body>
</html>
